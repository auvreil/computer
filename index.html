<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuvOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-wallpaper="azure">

  <div id="bootScreen">
    <div class="boot-logo">&#128421;</div>
    <div class="boot-title">AuvOS</div>
    <div id="bootStatus" class="boot-status">Starting&hellip;</div>
  </div>

  
  <div id="desktopWrap" style="display:none">
    <div id="desktopIcons" class="desktop-icons"></div>
    <div id="windowsLayer"></div>
  </div>


  <div id="desktopContextMenu" class="context-menu">
    <button data-action="refresh">Refresh</button>
    <button data-action="newfolder">New Folder</button>
    <button data-action="personalize">Personalize</button>
  </div>


  <div id="taskbar" class="taskbar" style="display:none">
    <button id="startButton" class="start-btn" title="Start">&#9776;</button>
    <div id="taskbarApps" class="taskbar-apps"></div>
    <div id="clock" class="clock"></div>
  </div>

  <div id="startMenu" class="start-menu">
    <input id="startSearch" class="start-search" type="text" placeholder="Search apps&hellip;" spellcheck="false">
    <div id="startMenuApps" class="start-menu-apps"></div>
  </div>

  <script src="js/registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/windowManager.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/taskbar.js"></script>
  
  <script src="js/apps/about.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/explorer.js"></script>
  <script src="js/apps/notepad.js"></script>
  <script src="js/apps/sc16.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/terminal.js"></script>


  <script src="js/boot.js"></script>
</body>
</html>
